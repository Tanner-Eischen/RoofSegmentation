services:
  roof-detection:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MODEL_PATH: /app/models/best.pt
      ROOF_MODEL_RELEASE: /app/models/best.release.json
      ROOF_DEMO_MODE: "false"
      ROOF_CPU_THREADS: "2"
    volumes:
      - ./models:/app/models:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=10)"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s
