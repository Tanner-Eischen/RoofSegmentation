name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  roof-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-smoke.txt
      - name: Install CPU PyTorch and pipeline checks
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-smoke.txt
      - name: Lint training pipeline
        run: python -m ruff check roof_pipeline scripts/download_whu.py scripts/make_smoke_dataset.py tests integration_optional/api
      - name: Test dataset guards and train/evaluate/predict workflow
        run: python -m pytest tests/ -q

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backend tests
        run: pytest api/tests/ -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Lint
        working-directory: app
        run: npm run lint

      - name: Run tests
        working-directory: app
        run: npm test

      - name: Build
        working-directory: app
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Install Playwright browser
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        working-directory: app
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: app/playwright-report/
          if-no-files-found: ignore
