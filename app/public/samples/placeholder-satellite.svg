<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#2a3a2a"/>
      <rect width="20" height="20" fill="#1a2a1a"/>
      <rect x="20" y="20" width="20" height="20" fill="#1a2a1a"/>
    </pattern>
  </defs>
  <rect width="640" height="640" fill="url(#grid)"/>
  <!-- Simulated roads -->
  <rect x="300" y="0" width="40" height="640" fill="#3a3a3a"/>
  <rect x="0" y="300" width="640" height="40" fill="#3a3a3a"/>
  <!-- Simulated roofs -->
  <polygon points="100,100 200,100 220,180 80,180" fill="#4a4a4a"/>
  <polygon points="400,150 550,150 570,280 380,280" fill="#5a5a5a"/>
  <polygon points="80,400 180,400 200,520 60,520" fill="#4a4a4a"/>
  <polygon points="450,380 580,380 600,500 430,500" fill="#555555"/>
  <!-- Label -->
  <text x="320" y="620" text-anchor="middle" fill="#666" font-family="sans-serif" font-size="14">Demo Mode - Sample Satellite View</text>
</svg>